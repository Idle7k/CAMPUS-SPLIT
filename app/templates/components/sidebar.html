<div class="flex-1 flex flex-col justify-between p-4 overflow-y-auto">
    <div class="space-y-6">
        <!-- Logo and App Identity -->
        <div class="flex items-center space-x-3 px-2 py-2">
            <div class="w-9 h-9 rounded-xl bg-emerald-700 flex items-center justify-center text-white font-bold text-base shadow-sm">
                CS
            </div>
            <div>
                <h1 class="text-base font-semibold tracking-tight text-stone-900 leading-none">Campus Split</h1>
                <span class="text-xs text-stone-600 font-mono">v0.1.0 &bull; Localhost</span>
            </div>
        </div>

        <!-- Navigation Links -->
        <nav class="space-y-1">
            <a href="/dashboard" 
               class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active_page == 'dashboard' %}bg-stone-100 text-stone-900 font-semibold{% else %}text-stone-600 hover:bg-stone-50 hover:text-stone-900{% endif %}">
                <svg class="w-5 h-5 {% if active_page == 'dashboard' %}text-emerald-700{% else %}text-stone-600{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                <span>Dashboard</span>
            </a>

            <a href="/vendors" 
               class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active_page == 'vendors' %}bg-stone-100 text-stone-900 font-semibold{% else %}text-stone-600 hover:bg-stone-50 hover:text-stone-900{% endif %}">
                <svg class="w-5 h-5 {% if active_page == 'vendors' %}text-emerald-700{% else %}text-stone-600{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                </svg>
                <span>Campus Vendors</span>
            </a>
        </nav>

        {% if current_user.role.value == 'admin' %}
        <!-- Administrator Menu Section -->
        <div class="pt-4 border-t border-stone-200">
            <span class="px-3 text-xs font-semibold tracking-wider text-stone-600 uppercase">Administration</span>
            <div class="mt-2 space-y-1">
                <a href="/admin/vendors" 
                   class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active_page == 'admin_vendors' %}bg-stone-100 text-stone-900 font-semibold{% else %}text-stone-600 hover:bg-stone-50 hover:text-stone-900{% endif %}">
                    <svg class="w-5 h-5 {% if active_page == 'admin_vendors' %}text-emerald-700{% else %}text-stone-600{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span>Vendor Management</span>
                </a>
            </div>
        </div>
        {% endif %}
    </div>

    <!-- User Account & Logout Footer -->
    <div class="pt-4 border-t border-stone-200">
        <div class="flex items-center justify-between p-2 rounded-xl bg-stone-50 border border-stone-200/80">
            <div class="flex items-center space-x-2.5 min-w-0">
                <div class="w-8 h-8 rounded-full bg-stone-200 text-stone-700 flex items-center justify-center font-semibold text-xs shrink-0">
                    {{ current_user.username[:2]|upper }}
                </div>
                <div class="min-w-0">
                    <p class="text-sm font-medium text-stone-900 truncate leading-tight">{{ current_user.username }}</p>
                    <span class="inline-flex items-center text-[10px] font-medium tracking-wide uppercase px-1.5 py-0.5 rounded {% if current_user.role.value == 'admin' %}bg-amber-100 text-amber-800{% else %}bg-emerald-100 text-emerald-800{% endif %}">
                        {{ current_user.role.value }}
                    </span>
                </div>
            </div>
            
            <form action="/logout" method="POST" class="shrink-0">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button type="submit" title="Sign out" class="p-1.5 text-stone-600 hover:text-stone-900 hover:bg-stone-200/60 rounded-lg transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                </button>
            </form>
        </div>
    </div>
</div>
