{% extends "base.html" %}

{% block title %}Not Found (404) — Campus Split{% endblock %}
{% block page_title %}Page Not Found{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 text-center cs-card p-8">
    <div class="w-12 h-12 rounded-full bg-stone-100 text-stone-600 flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
    </div>
    <h3 class="text-xl font-bold text-stone-900">404 — Page Not Found</h3>
    <p class="mt-2 text-xs text-stone-600">
        The requested campus resource or page does not exist.
    </p>
    <div class="mt-6 flex justify-center gap-3">
        <a href="/dashboard" class="cs-btn-primary text-xs">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
